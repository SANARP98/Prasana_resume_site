services:
  portfolio:
    build:
      context: .
      dockerfile: Dockerfile
      platforms:
        - linux/amd64
      args:
        - BUILDKIT_INLINE_CACHE=1
    image: prasana-resume-site:latest
    container_name: prasana-portfolio
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=production
      - MONGO_URI=mongodb+srv://gtacjs_db_user:JiUNqhX04k152sEj@webhook-onesource.7zwchzr.mongodb.net/?appName=webhook-onesource
      - MONGO_DB_NAME=portfolio_analytics
      - ADMIN_PASSWORD_HASH=$2a$10$6VuxDWOTDCU7jI00/gEEI.iu61PqiO1inNduOFhaM/jwHI8aCo6mu
      - ADMIN_SECRET=prasana-portfolio-admin-secret-2024
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    # Resource limits for production
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
        reservations:
          cpus: '0.1'
          memory: 32M
    networks:
      - portfolio-network
    # Security options
    security_opt:
      - no-new-privileges:true

networks:
  portfolio-network:
    driver: bridge
